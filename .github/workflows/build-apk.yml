name: Build OAMS APK

# Builds the OAMS Field App (oams-mobile/) into an installable Android APK.
# The APK is uploaded as a workflow artifact AND committed back to the branch
# under dist/ so it can be downloaded directly.

on:
  push:
    branches: [ "claude/app-brief-to-apk-1c9aau" ]
    paths:
      - "oams-mobile/**"
      - ".github/workflows/build-apk.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0" > /dev/null

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        working-directory: oams-mobile
        run: npm ci

      - name: Sync Capacitor Android
        working-directory: oams-mobile
        run: npx cap sync android

      - name: Build debug APK
        working-directory: oams-mobile/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Stage APK
        run: |
          mkdir -p dist
          cp oams-mobile/android/app/build/outputs/apk/debug/app-debug.apk dist/oams-field-app-debug.apk
          ls -la dist/

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: oams-field-app-debug
          path: dist/oams-field-app-debug.apk
          if-no-files-found: error

      - name: Commit APK back to branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f dist/oams-field-app-debug.apk
          if git diff --cached --quiet; then
            echo "APK unchanged — nothing to commit"
          else
            git commit -m "build: OAMS debug APK [skip ci]"
            git push origin HEAD:refs/heads/claude/app-brief-to-apk-1c9aau
          fi
