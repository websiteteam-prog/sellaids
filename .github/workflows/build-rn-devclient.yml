name: Build OAMS RN Dev APK

# Builds a DEVELOPMENT BUILD (expo-dev-client) of the oams-rn app.
# This APK replaces "Expo Go" — it is locked to the project's exact SDK 51,
# so scanning the QR from `npx expo start --dev-client` works with live reload
# (no "Something went wrong" / SDK-mismatch error that Expo Go from the Play
# Store gives).
#
# It is a DEBUG build: it does NOT embed the JS, it loads the JS from your PC's
# Metro server over the QR/tunnel. Use it only for live editing on your phone.
# For the standalone installable app, use build-rn-apk.yml instead.

on:
  push:
    branches: [ "claude/app-brief-to-apk-1c9aau" ]
    paths:
      - "oams-rn/**"
      - ".github/workflows/build-rn-devclient.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-rn-devclient-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0" > /dev/null

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        working-directory: oams-rn
        run: npm ci

      - name: Prebuild Android project (Expo)
        working-directory: oams-rn
        env:
          CI: "1"
        run: npx expo prebuild --platform android --no-install

      - name: Build debug APK (dev-client launcher, arm64)
        working-directory: oams-rn/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace -PreactNativeArchitectures=arm64-v8a

      - name: Stage APK
        run: |
          mkdir -p dist-rn
          cp oams-rn/android/app/build/outputs/apk/debug/app-debug.apk dist-rn/oams-field-app-dev.apk
          ls -la dist-rn/

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: oams-field-app-dev
          path: dist-rn/oams-field-app-dev.apk
          if-no-files-found: error

      - name: Publish Dev APK to a GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete oams-dev-latest --yes --cleanup-tag || true
          gh release create oams-dev-latest \
            dist-rn/oams-field-app-dev.apk \
            --title "OAMS Field App — Dev Client APK (live edit)" \
            --notes "Development build (expo-dev-client) for SDK 51. Install this instead of Expo Go, then run 'npx expo start --dev-client --tunnel' on your PC and scan the QR to live-edit. arm64 phones." \
            --target "$GITHUB_SHA"
          echo "Download: https://github.com/${GITHUB_REPOSITORY}/releases/download/oams-dev-latest/oams-field-app-dev.apk"
