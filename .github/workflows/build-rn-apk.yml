name: Build OAMS RN APK

# Builds the React Native (Expo) app in oams-rn/ into an installable APK.
# APK is uploaded as an artifact AND committed to dist-rn/ for direct download.

on:
  push:
    branches: [ "claude/app-brief-to-apk-1c9aau" ]
    paths:
      - "oams-rn/**"
      - ".github/workflows/build-rn-apk.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-rn-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0" > /dev/null

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        working-directory: oams-rn
        run: npm ci

      - name: Prebuild Android project (Expo)
        working-directory: oams-rn
        env:
          CI: "1"
        run: npx expo prebuild --platform android --no-install

      - name: Build release APK (standalone, arm64, JS embedded)
        working-directory: oams-rn/android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace -PreactNativeArchitectures=arm64-v8a

      - name: Stage APK
        run: |
          mkdir -p dist-rn
          cp oams-rn/android/app/build/outputs/apk/release/app-release.apk dist-rn/oams-field-app-rn.apk
          ls -la dist-rn/

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: oams-field-app-rn
          path: dist-rn/oams-field-app-rn.apk
          if-no-files-found: error

      - name: Publish APK to a GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete oams-rn-latest --yes --cleanup-tag || true
          gh release create oams-rn-latest \
            dist-rn/oams-field-app-rn.apk \
            --title "OAMS Field App — React Native APK" \
            --notes "Latest React Native (Expo) standalone release APK (arm64). Install on any modern Android phone." \
            --target "$GITHUB_SHA"
          echo "Download: https://github.com/${GITHUB_REPOSITORY}/releases/download/oams-rn-latest/oams-field-app-rn.apk"
