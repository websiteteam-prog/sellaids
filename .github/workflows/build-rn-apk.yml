name: Build OAMS RN APK

# Builds the React Native (Expo) app in oams-rn/ into an installable APK.
# APK is uploaded as an artifact AND committed to dist-rn/ for direct download.

on:
  push:
    branches: [ "claude/app-brief-to-apk-1c9aau" ]
    paths:
      - "oams-rn/**"
      - ".github/workflows/build-rn-apk.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-rn-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0" > /dev/null

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        working-directory: oams-rn
        run: npm ci

      - name: Prebuild Android project (Expo)
        working-directory: oams-rn
        env:
          CI: "1"
        run: npx expo prebuild --platform android --no-install

      - name: Build debug APK
        working-directory: oams-rn/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Stage APK
        run: |
          mkdir -p dist-rn
          cp oams-rn/android/app/build/outputs/apk/debug/app-debug.apk dist-rn/oams-field-app-rn-debug.apk
          ls -la dist-rn/

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: oams-field-app-rn-debug
          path: dist-rn/oams-field-app-rn-debug.apk
          if-no-files-found: error

      - name: Commit APK back to branch
        env:
          GIT_SSL_CAINFO: /etc/ssl/certs/ca-certificates.crt
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config --global http.sslCAInfo /etc/ssl/certs/ca-certificates.crt
          git add -f dist-rn/oams-field-app-rn-debug.apk
          if git diff --cached --quiet; then
            echo "APK unchanged — nothing to commit"
          else
            git commit -m "build: OAMS React Native debug APK [skip ci]"
            git -c http.sslCAInfo=/etc/ssl/certs/ca-certificates.crt push origin HEAD:refs/heads/claude/app-brief-to-apk-1c9aau
          fi
